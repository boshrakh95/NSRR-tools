# ============================================================
# Phase 0 — V3 Config — Overlapping-Window Fixed-K Protocol
# ============================================================
# Changes from phase0_v2_config.yaml:
#   results_dir    → results/phase0_v3
#   logs           → logs_v3/
#   window sampling → overlapping (K = min(K_max, T-N+1)) — see dataset code
#   context_lr_overrides → enabled for 120m and 240m
#
# All v2 experiments must be rerun with this config; do NOT mix v2 and v3
# results in the same comparison figure.

# ── Embedding Extraction ─────────────────────────────────────────────────────
embedding:
  checkpoint_dir: "/home/boshra95/sleepfm-clinical/sleepfm/checkpoints/model_base"
  output_dir: "/scratch/boshra95/psg_full/unified/embeddings/sleepfm_5sec"
  chunk_batch_size: 16
  datasets:
    - apples
    - shhs
    - mros
    - stages

# ── HDF5 Signal Data ─────────────────────────────────────────────────────────
data:
  hdf5_dir: "/scratch/boshra95/psg_full"
  sampling_freq: 128
  chunk_seconds: 300
  patch_size: 640
  patches_per_chunk: 60
  max_channels:
    BAS: 10
    RESP: 7
    EKG: 2
    EMG: 4
  channel_priority:
    BAS:
      - C3-M2
      - C4-M1
      - LOC
      - ROC
      - O1-M2
      - O2-M1
      - F3-M2
      - F4-M1
      - A1
      - A2
    RESP:
      - Airflow
      - Thor
      - ABD
      - SpO2
      - HR
      - Snore
      - RespRate
    EKG:
      - EKG
      - ECG-L
      - ECG-R
    EMG:
      - CHIN
      - LLEG
      - RLEG
      - EMG

# ── Context-Window Dataset ───────────────────────────────────────────────────
dataset:
  embedding_dir: "/scratch/boshra95/psg_full/unified/embeddings/sleepfm_5sec"

  # V2 targets (shared — only results dir changes in v3)
  label_source: "/scratch/boshra95/psg/unified/targets_v2/master_targets.parquet"
  task_subject_dir: "/scratch/boshra95/psg/unified/targets_v2/task_subjects"

  sleep_stage_dir: "/scratch/boshra95/psg"

  context_lengths:
    - "30s"
    - "10m"
    - "40m"
    - "80m"
    - "120m"
    - "240m"

  task: "sex_binary"
  task_type: "seq2label"

  datasets:
    - apples
    - shhs
    - mros
    - stages

  train_split: 0.70
  val_split:   0.15
  test_split:  0.15
  split_seed:  42

  windows_per_subject: 5

  # ── seq2seq window design (sleep staging only) ───────────────────────────────
  # These three params are only meaningful for seq2seq tasks (task_type: seq2seq).
  # They have no effect on seq2label tasks.
  #
  # seq2seq_context_mode:
  #   "causal"   — window = [anchor_end - N : anchor_end]  (past-only context)
  #                Used in: sleep_staging_lstm_old_arch128,
  #                         sleep_staging_transformer_old_arch128
  #                Model: hidden_dim=128, num_layers=1 (see model section below)
  #   "centered" — window = [(N-6)//2 before anchor] + [6 anchor patches] + [(N-6)//2 after]
  #                Symmetric context; exploits both past and future signal.
  #                Used in: sleep_staging_lstm, sleep_staging_transformer (new runs)
  #                Model: hidden_dim=256, num_layers=2 (see model section below)
  seq2seq_context_mode: "centered"

  # seq2seq_padding_policy: controls which anchors are included in the index.
  #   "allow_all"    — all anchors included; for causal mode the legacy min_past
  #                    filter still applies (controlled by min_past_denom /
  #                    max_min_past_patches below).
  #                    Used in: sleep_staging_*_old_arch128 results.
  #   "max_fraction" — only anchors where padding/N <= seq2seq_max_padding_fraction.
  #   "complete_only"— only anchors where padding == 0 (full context on both sides
  #                    for centered; full past for causal). No Flash-attention
  #                    penalty — every batch is padding-free.
  #                    Used in: new sleep_staging runs.
  seq2seq_padding_policy: "complete_only"

  # seq2seq_max_padding_fraction: fraction threshold for the "max_fraction" policy.
  # Ignored when policy is "allow_all" or "complete_only".
  seq2seq_max_padding_fraction: 0.5

  # Legacy min_past params — only used when seq2seq_padding_policy: "allow_all".
  min_past_denom:       8
  max_min_past_patches: 240

  # Cohort consistency filter: exclude subjects whose full recording is shorter
  # than this many patches from ALL context lengths (not just from 240m).
  # Ensures the same subject pool is used at every point on the sweep curve so
  # that context-length comparisons are not confounded by cohort differences.
  # Value = max context length in sweep: 240m × 60s/m ÷ 5s/patch = 2880.
  # Set to 0 to disable. See docs/cohort_filter.md for details and exclusion list.
  min_recording_patches: 2880

# ── Sequence Head Model ──────────────────────────────────────────────────────
# ┌─ Model size history ────────────────────────────────────────────────────────┐
# │ hidden_dim=128, num_layers=1  →  658K params (LSTM bidir) / 264K (Transformer)
# │   Used for: ALL binary/multiclass seq2label tasks (bmi, sex, apnea, cvd, …)
# │             AND the archived sleep staging runs:
# │               sleep_staging_lstm_old_arch128
# │               sleep_staging_transformer_old_arch128
# │
# │ hidden_dim=256, num_layers=2  →  3.16M params (LSTM bidir) / ~1M (Transformer)
# │   Used for: sleep staging NEW runs (sleep_staging_lstm, sleep_staging_transformer)
# │             on the sleep-stage-redesign branch.
# │   Rationale: V1 sleep staging used this size and achieved substantially higher
# │              kappa (0.62 vs 0.56 at 10m). The 5-class seq2seq task needs more
# │              model capacity than binary seq2label tasks.
# └────────────────────────────────────────────────────────────────────────────┘
model:
  input_dim: 512
  head_type: "lstm"
  hidden_dim: 128   # matches fast-channel seq2label baseline → clean channel-only comparison
  num_layers: 1     # sleep staging uses 256/2 via phase0_v3_full_staging_config.yaml
  num_heads:  8
  dropout:    0.3
  num_classes: 2

# ── Training ─────────────────────────────────────────────────────────────────
training:
  epochs: 40
  lr: 1.0e-4
  weight_decay: 1.0e-3
  optimizer: "adamw"
  scheduler: "cosine"
  early_stopping_patience: 10
  device: "cuda"
  mixed_precision: false
  class_weights: "auto"
  early_stopping_monitor: "val_auroc"
  weighted_sampler: false

  # K-selection strategy for training windows per subject:
  #   "fixed"        — RECOMMENDED for context-length comparison experiments.
  #                    Uses dataset.windows_per_subject as K_max for all context
  #                    lengths. With overlapping-window sampling (see dataset code),
  #                    K=K_max is achieved for essentially all subjects at every L.
  #   "token_budget" — ⚠ SECONDARY ANALYSIS ONLY. Do NOT use as the primary
  #                    training protocol: it sets K ∝ 1/L (short contexts get many
  #                    more windows than long contexts), which confounds K and L.
  #                    Any observed performance gap could reflect K differences,
  #                    not context quality. Only use for §10 (equal-compute analysis).
  windows_strategy: "fixed"
  token_budget_minutes: 240  # only relevant when windows_strategy: "token_budget"
  k_max: 50                  # hard cap for token_budget mode

  # Per-context LR overrides — applied only when no --lr flag is passed from CLI.
  # Longer contexts (120m, 240m) use a slightly lower LR because:
  #   (a) overlapping windows at long L are more correlated, producing noisier
  #       gradient estimates than at short L;
  #   (b) smaller batch size (required to avoid OOM) already reduces effective LR.
  # Halving LR at 120m/240m is a conservative compensation.
  # Set to null to disable (all contexts use training.lr).
  context_lr_overrides:
    "120m": 5.0e-5
    "240m": 5.0e-5

  # ── Overfitting / scaling-law analysis ───────────────────────────────────────
  overfit_epochs: 0

  # ── Periodic snapshot checkpoints ────────────────────────────────────────────
  save_snapshots: true
  snapshot_interval: 5

# ── Analysis ─────────────────────────────────────────────────────────────────
analysis:
  bootstrap_samples: 0

# ── Logging & Output ─────────────────────────────────────────────────────────
logging:
  results_dir: "/scratch/boshra95/psg_full/unified/results/phase0_v3_full"
