# ============================================================
# V2 OSF LoRA Registry — Stage 2 (LoRA fine-tuning of OSF backbone)
# ============================================================
# Forked from experiments/v2_osf_registry.yaml (checklist 2.5,
# docs/TSFM_OSF_IMPLEMENTATION_PLAN.md). Same 15 tier-1 entries (5 tasks ×
# 3 heads), same datasets/contexts/tier/notes per task, same
# gradient_accumulation/effective_batch=32 convention as Stage 1/SleepFM —
# required for a fair Stage 1 vs Stage 2 comparison on identical
# subjects/splits AND identical training dynamics (gradient noise,
# optimization trajectory). Only what's genuinely different for LoRA
# fine-tuning changes:
#
#   - config/results_dir/inference_dir/logs_dir point at Stage 2's isolated
#     paths (phase0_osf_lora, logs_osf_lora), never overlapping Stage 1's.
#   - `batch_size: 32` + `gradient_accumulation` (effective_batch=32,
#     context_micro_batch all at 32 → accum_steps=1 everywhere as a
#     starting point) — same schema and same NOT-YET-GPU-CALIBRATED
#     caveat as Stage 1's registry. This was originally omitted entirely
#     (flat batch_size=4, no accumulation) on the mistaken assumption that
#     Stage 2's heavier per-item cost (full backbone forward+backward,
#     not a cached-embedding lookup) justified skipping effective-batch
#     parity — corrected 2026-08-14: `train_osf_lora.py` already had
#     `run_epoch()`'s accum_steps machinery available (imported from
#     train_osf_context_sweep.py) and just needed `--accum-steps` wired
#     through, same as Stage 1. If `context_micro_batch` values here don't
#     fit at a given context, lower the micro-batch and raise accum_steps
#     proportionally (e.g. 8 micro × 4 accum = 32 effective) rather than
#     accepting a smaller effective batch — see checklist 2.6.
#   - `task_type` is informational only here — train_osf_lora.py has no
#     --task-type flag (OSFRawEpochWindowDataset is seq2label-only for
#     now, see its module docstring). Kept for side-by-side readability
#     against v2_osf_registry.yaml, not read by gen_commands_osf_lora.py.
#
# Use gen_commands_osf_lora.py (not gen_commands_osf.py or gen_commands.py)
# to generate commands from this file.

config: configs/phase0_osf_lora_config.yaml
results_dir: /scratch/boshra95/psg_full/unified/results/phase0_osf_lora
inference_dir: /scratch/boshra95/psg_full/unified/results/phase0_osf_lora/inference
logs_dir: /home/boshra95/NSRR-tools/logs_osf_lora
python_bin: /home/boshra95/osf_env/bin/python

# ── Training protocol ────────────────────────────────────────────────────────
# Same schema/convention as v2_osf_registry.yaml (Stage 1) and
# v2_full_registry.yaml (SleepFM) — see those files' headers for the full
# field reference. NOT YET GPU-CALIBRATED FOR STAGE 2 (only CPU-debugged
# with --batch-size 2) — starting every context at micro_batch=32 (same as
# Stage 1/SleepFM) is an assumption, not a verified fit; revisit after the
# first real GPU run (checklist 2.6) if OOM is observed, lowering
# micro-batch and raising accum_steps to keep effective_batch=32.
gradient_accumulation:
  enabled: true
  effective_batch: 32
  context_micro_batch:
    "30s":  32
    "10m":  32
    "40m":  32
    "80m":  32
    "120m": 32
    "240m": 32

# ── Tier 1: 5 Tier-1 tasks × 3 heads = 15 experiments ──────────────────────

experiments:

  # ── sex_binary (N=13,163 — APPLES, SHHS) ─────────────────────────────────
  sex_binary_lstm:
    task: sex_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, shhs]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "Female=1, Male=0. MrOS excluded (all-male cohort, zero variance)."

  sex_binary_transformer:
    task: sex_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, shhs]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  sex_binary_mean_pool:
    task: sex_binary
    task_type: seq2label
    num_classes: 2
    head: mean_pool
    datasets: [apples, shhs]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "Baseline (no temporal modelling)."

  # ── sleep_efficiency_binary (N=13,615 — APPLES, SHHS, MrOS) ─────────────
