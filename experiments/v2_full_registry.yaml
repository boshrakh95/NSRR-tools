# ════════════════════════════════════════════════════════════════════════════════
# PHASE 0 LEGACY TASKS — re-run under v3 protocol
#
# All tasks below existed in phase0 (old code, non-overlapping windows, variable
# batch protocol). They are re-run here so results land in phase0_v3/ and are
# directly comparable to the v2-definition tasks above.
#
# Run order: Tier 1 (strong signal) → Tier 2 (decent signal) → Deferred (poor signal).
# ════════════════════════════════════════════════════════════════════════════════

# ── Re-run Tier 1: strong signal, large N ────────────────────────────────────

  # ── apnea_binary (N=14,097 — SHHS, MrOS, APPLES, STAGES) ───────────────────
  # Standard AHI>=15 definition. Well-balanced (~49% vs 51%). Multi-dataset.
  # Phase0 results: AUROC improved monotonically from 0.67 (30s) to 0.73 (40m).
  # Primary OSA task for the paper. Run all 3 heads like other Tier 1 tasks.
  apnea_binary_lstm:
    task: apnea_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, shhs, mros, stages]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "AHI >= 15 = moderate/severe OSA. Standard clinical threshold. ~1:1 class balance."

  apnea_binary_transformer:
    task: apnea_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, shhs, mros, stages]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  apnea_binary_mean_pool:
    task: apnea_binary
    task_type: seq2label
    num_classes: 2
    head: mean_pool
    datasets: [apples, shhs, mros, stages]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 128
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "Baseline (no temporal modelling)."

  # ── sleep_staging ────────────────────────────────────────────────────────────
  # Anchor-based seq2seq: model sees a context window, predicts label of the
  # centre epoch. task_type=seq2seq is fully supported by train_context_sweep.py.
  # 5 classes: W=0, N1=1, N2=2, N3=3, REM=4.
  # Primary metric for paper: Cohen's kappa + per-stage F1 (script also logs AUROC).
  # N1 is minority (~5-8% of epochs) — expected lowest per-stage F1.
  #
  # Dataset history:
  #   _with_stages  (run_tag="with_stages"): shhs+mros+stages+apples — STAGES dominates
  #     training data (54% of items, 10% of subjects, 11x longer recordings).
  #     Result: kappa ~0.55 at 10m — below phase0 baseline.
  #     Results archived: sleep_staging_{lstm,transformer}_with_stages/
  #   (no tag) PRIMARY: shhs+mros+apples only — matches phase0 protocol.
  #     Phase0 achieved kappa=0.62 at 10m with identical arch on these 3 datasets.
  #     Results: sleep_staging_{lstm,transformer}/

  sleep_staging_lstm:
    task: sleep_staging
    task_type: seq2seq
    num_classes: 5
    head: lstm
    datasets: [shhs, mros, apples]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    config: configs/phase0_v3_full_staging_config.yaml   # hidden=256, layers=2 — overrides registry default
    notes: "PRIMARY run — shhs+mros+apples only (no STAGES). Matches phase0 protocol. Target kappa ~0.62 at 10m."

  sleep_staging_transformer:
    task: sleep_staging
    task_type: seq2seq
    num_classes: 5
    head: transformer
    datasets: [shhs, mros, apples]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    config: configs/phase0_v3_full_staging_config.yaml   # hidden=256, layers=2 — overrides registry default
    notes: "PRIMARY run — shhs+mros+apples only (no STAGES)."

  sleep_staging_lstm_with_stages:
    task: sleep_staging
    task_type: seq2seq
    num_classes: 5
    head: lstm
    datasets: [shhs, mros, stages, apples]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: "with_stages"
    n_size: large
    tier: 2
    config: configs/phase0_v3_full_staging_config.yaml   # hidden=256, layers=2 — overrides registry default
    notes: "COMPARISON — includes STAGES. Kappa ~0.55 at 10m (STAGES dominates data, hurts perf). Results: sleep_staging_lstm_with_stages/"

  sleep_staging_transformer_with_stages:
    task: sleep_staging
    task_type: seq2seq
    num_classes: 5
    head: transformer
    datasets: [shhs, mros, stages, apples]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: "with_stages"
    n_size: large
    tier: 2
    config: configs/phase0_v3_full_staging_config.yaml   # hidden=256, layers=2 — overrides registry default
    notes: "COMPARISON — includes STAGES. Results: sleep_staging_transformer_with_stages/"

  sleep_staging_mean_pool:
    task: sleep_staging
    task_type: seq2seq
    num_classes: 5
    head: mean_pool
    datasets: [shhs, mros, apples]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 128
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    config: configs/phase0_v3_full_staging_config.yaml   # hidden=256, layers=2 — overrides registry default
    notes: "Mean-pool loses position info — may underperform on anchor-based staging. Included as baseline."

# ── Re-run Tier 2: decent signal, lstm only ───────────────────────────────────

  # ── cvd_binary (N=13,045 — SHHS + MrOS) ────────────────────────────────────
  # Phase0 results: AUROC improved from 0.64 (30s) to 0.67 (120m). Minority=25%.
  # WARNING: mixed CVD definitions across datasets:
  #   SHHS: any_cvd (composite: CHD + stroke + heart failure + peripheral vascular)
  #   MrOS: cvchd (coronary heart disease only — narrower definition)
  # Decision: keep merged for now (consistent with phase0) but note the mismatch.
  # Future: run as separate cvd_shhs_binary and cvd_mros_binary for cleaner science.
  cvd_binary_lstm:
    task: cvd_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [shhs, mros]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 2
    notes: "SHHS=any_cvd (composite), MrOS=cvchd (CHD only) — mixed definitions; see doc note. Minority=25%."

  cvd_binary_transformer:
