# ── Training protocol ────────────────────────────────────────────────────────────
#
# Single protocol: batch_size=32, accum_steps=1 at ALL context lengths.
#
# This is safe because:
#   - dataset.min_recording_patches=2880 removes subjects shorter than 240m from all
#     splits, ensuring all padding masks are all-False at every context length.
#   - TransformerHead.forward() passes src_key_padding_mask=None when the mask is
#     all-False → PyTorch selects Flash attention (O(N) memory, not O(N²) Math
#     attention which would require ~42 GB at 240m on a 9.75 GiB MIG slice).
#   - Confirmed in training logs: "[Attn] Flash (mask=None, O(N) memory) | N=2880".
#
# Paper claim: "All models were trained with batch size 32, identical across all
# context lengths."
#
# ── If you ever need to reduce micro-batch due to memory (e.g. new GPU/head) ────
# Lower the context_micro_batch values and increase effective_batch or keep it at 32.
# gen_commands.py automatically computes accum_steps = effective_batch / micro_batch.
# Example: to run 240m at micro_batch=8 with effective_batch=32 → accum_steps=4:
#   "240m": 8   (accum_steps computed as 32/8 = 4)
# The training script applies gradient accumulation correctly in both train and eval
# phases. No other changes needed.
#
# The gradient_accumulation section is kept for code compatibility (gen_commands.py
# reads it). With all context_micro_batch values at 32 and effective_batch=32,
# accum_steps = 32/32 = 1 everywhere — functionally identical to no accumulation.
gradient_accumulation:
  enabled: true
  effective_batch: 32
  context_micro_batch:
    "30s":  32   # accum=1
    "10m":  32   # accum=1
    "40m":  32   # accum=1
    "80m":  32   # accum=1
    "120m": 32   # accum=1
    "240m": 32   # accum=1  (Flash attention: O(N) memory, fits on 9.75 GiB MIG slice)

