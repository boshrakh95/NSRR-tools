    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [shhs, mros]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 2
    notes: "SHHS=any_cvd (composite), MrOS=cvchd (CHD only) — mixed definitions; see doc note. Minority=25%."

  # ── sleepiness_binary (N=16,431 — all 4 datasets) ───────────────────────────
  # ESS >= 11 = excessive daytime sleepiness. Largest N of all tasks.
  # Phase0 results: borderline AUROC 0.59-0.61 across all contexts (all 5 run).
  # v3 overlapping windows and 240m context may improve AUROC. Included as Tier 2
  # to assess whether signal improves with the v3 protocol.
  sleepiness_binary_lstm:
    task: sleepiness_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, shhs, mros, stages]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 2
    notes: "ESS >= 11 = positive. Minority=29.7%. Phase0 AUROC 0.59-0.61 — borderline. v3 may improve."

  sleepiness_binary_transformer:
    task: sleepiness_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, shhs, mros, stages]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 2
    notes: "ESS >= 11 = positive. Minority=29.7%. Phase0 AUROC 0.59-0.61 — borderline. v3 may improve."

