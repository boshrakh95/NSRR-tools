# ============================================================
# V2 OSF Registry — Stage 1 (frozen OSF backbone + our sequence heads)
# ============================================================
# Mirrors experiments/v2_full_registry.yaml field-for-field (same tasks,
# datasets, contexts, batch sizes, LR, tier) since OSF is compared against
# the full-channel SleepFM protocol (phase0_v3_full) — see
# docs/TSFM_OSF_IMPLEMENTATION_PLAN.md "Key Decisions" table. Only the
# top-level paths (config/results_dir/inference_dir/logs_dir/python_bin)
# and script names (resolved in gen_commands_osf.py) differ.
#
# Scope: the 5 Tier-1 tasks from CLAUDE.md's OSF first-pass scope (sex,
# sleep efficiency, BMI, age, apnea). sleep_staging (seq2seq) is deferred —
# not yet ported to OSFContextWindowDataset/train_osf_context_sweep.py.
#
# Fields: same as v2_registry.yaml — see that file's header for the field
# reference. Use gen_commands_osf.py (not gen_commands.py) to generate
# commands from this file.

config: configs/phase0_osf_config.yaml
results_dir: /scratch/boshra95/psg_full/unified/results/phase0_osf
inference_dir: /scratch/boshra95/psg_full/unified/results/phase0_osf/inference
logs_dir: /home/boshra95/NSRR-tools/logs_osf
python_bin: /home/boshra95/osf_env/bin/python

# ── Training protocol ────────────────────────────────────────────────────────
# Same batch_size/accum_steps values as v2_full_registry.yaml, reused as a
# starting point. NOT YET GPU-CALIBRATED FOR OSF (only CPU-debugged with
# --batch-size 2 as of 2026-08-11) — revisit after the first real GPU sweep
# (checklist item 1.10) if OOM/underutilization is observed. Mirrors the
# same accum_steps = effective_batch / micro_batch mechanism as SleepFM's
# registry so gen_commands_osf.py's resolve_batch_accum() works unmodified.
gradient_accumulation:
  enabled: true
  effective_batch: 32
  context_micro_batch:
    "30s":  32
    "10m":  32
    "40m":  32
    "80m":  32
    "120m": 32
    "240m": 32

# ── Tier 1: 5 Tier-1 tasks × 3 heads = 15 experiments ──────────────────────

experiments:

  # ── sex_binary (N=13,163 — APPLES, SHHS) ─────────────────────────────────
  sex_binary_lstm:
    task: sex_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, shhs] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "Female=1, Male=0. MrOS excluded (all-male cohort, zero variance)."

  sex_binary_transformer:
    task: sex_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, shhs] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  sex_binary_mean_pool:
    task: sex_binary
    task_type: seq2label
    num_classes: 2
    head: mean_pool
    datasets: [apples, shhs] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 64
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "Baseline (no temporal modelling)."

  # ── sleep_efficiency_binary (N=13,615 — APPLES, SHHS, MrOS) ─────────────
  sleep_efficiency_binary_lstm:
    task: sleep_efficiency_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, shhs, mros]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "Sleep efficiency < 85% = 1. STAGES excluded (no eff. score available)."

  sleep_efficiency_binary_transformer:
    task: sleep_efficiency_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, shhs, mros]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  sleep_efficiency_binary_mean_pool:
    task: sleep_efficiency_binary
    task_type: seq2label
    num_classes: 2
    head: mean_pool
    datasets: [apples, shhs, mros]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 128
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  # ── bmi_binary (APPLES, SHHS, MrOS) ─────────────────────────────────────
  bmi_binary_lstm:
    task: bmi_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, shhs, mros] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "BMI >= 30 = obese (WHO definition). MrOS: visit-1 labels only."

  bmi_binary_transformer:
    task: bmi_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, shhs, mros] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  bmi_binary_mean_pool:
    task: bmi_binary
    task_type: seq2label
    num_classes: 2
    head: mean_pool
    datasets: [apples, shhs, mros] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 128
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  # ── age_class (3-class — APPLES, SHHS, MrOS) ────────────────────────────
  age_class_lstm:
    task: age_class
    task_type: seq2label
    num_classes: 3
    head: lstm
    datasets: [apples, shhs, mros] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
