# ============================================================
# V2 Mantis LoRA Registry — Stage 2 (LoRA fine-tuning of Mantis backbone)
# ============================================================
# Forked from experiments/v2_mantis_registry.yaml (checklist 2.5,
# docs/TSFM_MANTIS_IMPLEMENTATION_PLAN.md §14.7). Same 5 Tier-1 tasks
# PLUS 2 Tier-2 secondary tasks (depression_extreme_binary,
# osa_binary_apples_postqc, added 2026-09-09 alongside Stage 1 — see
# v2_mantis_registry.yaml's header for the full rationale/verification),
# same datasets/contexts/tier/notes per task as Stage 1 — required for a
# fair Stage 1 vs Stage 2 comparison on identical subjects/splits AND
# identical training dynamics.
#
# **`mean_pool` is DEFERRED here — 14 experiments (7 tasks × lstm/
# transformer), not 21** (plan §5.6/§14.7): same decision both OSF and
# PhysioOmni made for their own Stage 2 (real LoRA compute cost, not worth
# tripling the sweep before the first two heads' numbers exist).
# `apnea_binary` IS included (unlike PhysioOmni's own LoRA registry,
# 8 experiments) — Mantis has a RESP pathway.
#
# Only what's genuinely different for LoRA fine-tuning vs Stage 1:
#   - config/results_dir/inference_dir/logs_dir point at Stage 2's isolated
#     paths (phase0_mantis_lora, logs_mantis_lora), never overlapping
#     Stage 1's — sharing Stage 1's logs_dir corrupted both stages' status
#     files for PhysioOmni (plan §4.10).
#   - `batch_size: 32` + `gradient_accumulation` (effective_batch=32,
#     context_micro_batch seeded from Pilot 3's single real GPU
#     measurement, NOT yet re-verified for Stage 2's backbone-in-the-loop
#     compute profile — checklist 2.6's real pilot replaces these numbers,
#     same "seed now, calibrate later" convention as Stage 1's own
#     registry).
#   - `task_type` is informational only here — train_mantis_lora.py has no
#     --task-type flag (MantisRawEpochWindowDataset is seq2label-only for
#     now). Kept for side-by-side readability against
#     v2_mantis_registry.yaml, not read by gen_commands_mantis_lora.py.
#
# Use gen_commands_mantis_lora.py (not gen_commands_mantis.py or
# gen_commands.py) to generate commands from this file.

config: configs/phase0_mantis_lora_config.yaml
results_dir: /scratch/boshra95/psg/unified/results/phase0_mantis_lora
inference_dir: /scratch/boshra95/psg/unified/results/phase0_mantis_lora/inference
logs_dir: /home/boshra95/NSRR-tools-mantis/logs_mantis_lora
python_bin: /home/boshra95/mantis_env/bin/python

# ── Training protocol ────────────────────────────────────────────────────────
# NOT YET GPU-CALIBRATED FOR STAGE 2 — only CPU-debugged so far (checklist
# 2.4's synthetic correctness test, checklist 2.5's tiny real
# train+infer smoke test). Starting every context at micro_batch=32 is an
# assumption, not a verified fit — revisit after checklist 2.6's real
# pilot, lowering micro-batch and raising accum_steps to keep
# effective_batch=32 if a context OOMs.
gradient_accumulation:
  enabled: true
  effective_batch: 32
  context_micro_batch:
    "30s":  32
    "10m":  32
    "40m":  32
    "80m":  32
    "120m": 32
    "240m": 32

# ── Tier 1: 5 Tier-1 tasks × 2 heads (mean_pool deferred) = 10 experiments ──
# ── Tier 2: 2 secondary tasks × 2 heads (mean_pool deferred) = 4 experiments ─

experiments:

  # ── sex_binary (N=13,163 — APPLES, SHHS) ─────────────────────────────────
  sex_binary_lstm:
    task: sex_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, shhs]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "Female=1, Male=0. MrOS excluded (all-male cohort, zero variance)."

  sex_binary_transformer:
    task: sex_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, shhs]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  # ── sleep_efficiency_binary (N=13,615 — APPLES, SHHS, MrOS) ─────────────
  sleep_efficiency_binary_lstm:
    task: sleep_efficiency_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, shhs, mros]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "Sleep efficiency < 85% = 1. STAGES excluded (no eff. score available)."

  sleep_efficiency_binary_transformer:
    task: sleep_efficiency_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, shhs, mros]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  # ── bmi_binary (APPLES, SHHS, MrOS) ─────────────────────────────────────
  bmi_binary_lstm:
    task: bmi_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, shhs, mros]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "BMI >= 30 = obese (WHO definition). MrOS: visit-1 labels only."

  bmi_binary_transformer:
    task: bmi_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, shhs, mros]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  # ── age_class (3-class — APPLES, SHHS, MrOS) ────────────────────────────
  age_class_lstm:
    task: age_class
    task_type: seq2label
    num_classes: 3
    head: lstm
    datasets: [apples, shhs, mros]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "3-class: <50=0, 50-64=1, >=65=2. MrOS all class 2 (65+ cohort)."

  age_class_transformer:
    task: age_class
    task_type: seq2label
    num_classes: 3
    head: transformer
    datasets: [apples, shhs, mros]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  # ── apnea_binary (APPLES, SHHS, MrOS, STAGES) ───────────────────────────
  # Mantis is the only one of the three baselines with a RESP pathway —
  # directly comparable to OSF here, unlike PhysioOmni's own LoRA registry
  # which excludes this task entirely.
  apnea_binary_lstm:
    task: apnea_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, shhs, mros, stages]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "AHI >= 15 = moderate/severe OSA. Standard clinical threshold. ~1:1 class balance."

  apnea_binary_transformer:
    task: apnea_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, shhs, mros, stages]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  # ── depression_extreme_binary (N=1,761 — APPLES + STAGES) ────────────────
  # mean_pool deferred, same convention as Tier 1 above.
  depression_extreme_binary_lstm:
    task: depression_extreme_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, stages]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: small
    tier: 2
    notes: "Extreme-group design: BDI<=9->0 or >=20->1 (APPLES); PHQ-9 <=4->0 or >=15->1 (STAGES). Middle group dropped."

  depression_extreme_binary_transformer:
    task: depression_extreme_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, stages]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: small
    tier: 2
    notes: ""

  # ── osa_binary_apples_postqc (N=1,516 — APPLES only) ─────────────────────
  # A DIFFERENT task from apnea_binary above — see v2_mantis_registry.yaml's
  # header note. mean_pool deferred, same convention as Tier 1 above.
  osa_binary_apples_postqc_lstm:
    task: osa_binary_apples_postqc
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: small
    tier: 2
    notes: "Binary OSA severity post-QC: Non-rand+Mild->0, Moderate+Severe->1. APPLES only."

  osa_binary_apples_postqc_transformer:
    task: osa_binary_apples_postqc
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: small
    tier: 2
    notes: ""
