# ============================================================
# V2 Mantis Registry — Stage 1 (frozen Mantis-8M backbone + our sequence heads)
# ============================================================
# Task/dataset/n_size/notes fields copied VERBATIM from
# experiments/v2_osf_registry.yaml per docs/TSFM_MANTIS_IMPLEMENTATION_PLAN.md
# §5.8/§11: "5 Tier-1 tasks ... exactly OSF's set (registry fields, dataset
# lists, n_size, and notes copy verbatim from v2_osf_registry.yaml; only the
# config/results/logs paths change)". Unlike PhysioOmni's registry, apnea_binary
# IS included — Mantis is channel-agnostic (every channel, including RESP,
# goes through the same frozen encoder, plan §2.2), so it has no missing-
# modality gap the way PhysioOmni does (no respiratory pathway at all).
# This makes Mantis the only one of the three baselines directly comparable
# to OSF on apnea (plan §5.1/CLAUDE.md's PhysioOmni section).
#
# Only the top-level paths (config/results_dir/inference_dir/logs_dir/
# python_bin) and script names (resolved in gen_commands_mantis.py) differ
# from v2_osf_registry.yaml.
#
# Scope: the 5 Tier-1 tasks (sex, sleep efficiency, BMI, age, apnea).
# sleep_staging (seq2seq) is out of scope for all three baselines (plan §5.8).
#
# Fields: same as v2_registry.yaml — see that file's header for the field
# reference. Use gen_commands_mantis.py (not gen_commands.py or
# gen_commands_osf.py/gen_commands_physioomni.py) to generate commands from
# this file.

config: configs/phase0_mantis_config.yaml
results_dir: /scratch/boshra95/psg/unified/results/phase0_mantis
inference_dir: /scratch/boshra95/psg/unified/results/phase0_mantis/inference
logs_dir: /home/boshra95/NSRR-tools-mantis/logs_mantis
python_bin: /home/boshra95/mantis_env/bin/python

# ── Training protocol ────────────────────────────────────────────────────────
# Same batch_size/accum_steps values as v2_osf_registry.yaml/
# v2_physioomni_registry.yaml, reused as a starting point. NOT YET
# GPU-CALIBRATED FOR MANTIS (only CPU-debugged as of 2026-09-07) — revisit
# after the first real GPU sweep (checklist item 1.12) if OOM/
# underutilization is observed. Same accum_steps = effective_batch /
# micro_batch mechanism as SleepFM's/OSF's/PhysioOmni's registries so
# gen_commands_mantis.py's resolve_batch_accum() works unmodified.
gradient_accumulation:
  enabled: true
  effective_batch: 32
  context_micro_batch:
    "30s":  32
    "10m":  32
    "40m":  32
    "80m":  32
    "120m": 32
    "240m": 32

# ── Tier 1: 5 Tier-1 tasks × 3 heads = 15 experiments ──────────────────────

experiments:

  # ── sex_binary (N=13,163 — APPLES, SHHS) ─────────────────────────────────
  sex_binary_lstm:
    task: sex_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, shhs] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "Female=1, Male=0. MrOS excluded (all-male cohort, zero variance)."

  sex_binary_transformer:
    task: sex_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, shhs] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  sex_binary_mean_pool:
    task: sex_binary
    task_type: seq2label
    num_classes: 2
    head: mean_pool
    datasets: [apples, shhs] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 64
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "Baseline (no temporal modelling)."

  # ── sleep_efficiency_binary (N=13,615 — APPLES, SHHS, MrOS) ─────────────
  sleep_efficiency_binary_lstm:
    task: sleep_efficiency_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, shhs, mros]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "Sleep efficiency < 85% = 1. STAGES excluded (no eff. score available)."

  sleep_efficiency_binary_transformer:
    task: sleep_efficiency_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, shhs, mros]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  sleep_efficiency_binary_mean_pool:
    task: sleep_efficiency_binary
    task_type: seq2label
    num_classes: 2
    head: mean_pool
    datasets: [apples, shhs, mros]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 128
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  # ── bmi_binary (APPLES, SHHS, MrOS) ─────────────────────────────────────
  bmi_binary_lstm:
    task: bmi_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, shhs, mros] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "BMI >= 30 = obese (WHO definition). MrOS: visit-1 labels only."

  bmi_binary_transformer:
    task: bmi_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, shhs, mros] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  bmi_binary_mean_pool:
    task: bmi_binary
    task_type: seq2label
    num_classes: 2
    head: mean_pool
    datasets: [apples, shhs, mros] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 128
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  # ── age_class (3-class — APPLES, SHHS, MrOS) ────────────────────────────
  age_class_lstm:
    task: age_class
    task_type: seq2label
    num_classes: 3
    head: lstm
    datasets: [apples, shhs, mros] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "3-class: <50=0, 50-64=1, >=65=2. MrOS all class 2 (65+ cohort)."

  age_class_transformer:
    task: age_class
    task_type: seq2label
    num_classes: 3
    head: transformer
    datasets: [apples, shhs, mros] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  age_class_mean_pool:
    task: age_class
    task_type: seq2label
    num_classes: 3
    head: mean_pool
    datasets: [apples, shhs, mros] # , stages
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 128
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  # ── apnea_binary (APPLES, SHHS, MrOS, STAGES) ───────────────────────────
  # Mantis is the only one of the three baselines with a RESP pathway
  # (channel-agnostic encoder, plan §2.2) — directly comparable to OSF here,
  # unlike PhysioOmni which had to exclude this task entirely.
  apnea_binary_lstm:
    task: apnea_binary
    task_type: seq2label
    num_classes: 2
    head: lstm
    datasets: [apples, shhs, mros, stages]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "AHI >= 15 = moderate/severe OSA. Standard clinical threshold. ~1:1 class balance."

  apnea_binary_transformer:
    task: apnea_binary
    task_type: seq2label
    num_classes: 2
    head: transformer
    datasets: [apples, shhs, mros, stages]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 32
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: ""

  apnea_binary_mean_pool:
    task: apnea_binary
    task_type: seq2label
    num_classes: 2
    head: mean_pool
    datasets: [apples, shhs, mros, stages]
    contexts: [30s, 10m, 40m, 80m, 120m, 240m]
    batch_size: 128
    lr: 1.0e-4
    run_tag: ""
    n_size: large
    tier: 1
    notes: "Baseline (no temporal modelling)."
